services:
  postgres:
    image: postgres:16-alpine
    container_name: konsort_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-konsort_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisPassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-konsort_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gateway_net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: konsort_rest_gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-konsort_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisPassword123!}
      API_HOST: 0.0.0.0
      API_PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./devices.yaml:/app/devices.yaml:ro
      - ./tags:/app/tags:ro
    networks:
      - gateway_net

volumes:
  postgres_data:

networks:
  gateway_net:
    driver: bridge
